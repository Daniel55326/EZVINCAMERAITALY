<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>EZVIZ — Accesso account</title>
<style>
:root{color-scheme:dark;--bg:#1c1c1e;--field:#2b2b2d;--line:#39393c;--blue:#7da2ff;--text:#f5f5f7;--muted:#99999f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100svh}
.page{min-height:100svh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{width:100%;aspect-ratio:941/375;background:#20252d;overflow:hidden;flex:none}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.content{padding:clamp(24px,5vw,42px) clamp(20px,3.7vw,32px) 0}
.title{font-size:clamp(25px,6vw,32px);font-weight:600;letter-spacing:-.5px;margin-bottom:clamp(28px,6vw,42px)}
.form{width:100%}
.input-group{margin-bottom:clamp(22px,5vw,32px)}
.input-wrapper{display:flex;align-items:center;gap:14px;min-height:clamp(62px,10.5vw,76px);border:1.5px solid var(--line);border-radius:17px;padding:0 18px;background:var(--field);transition:border-color .2s}
.input-wrapper:focus-within{border-color:var(--blue)}
.input-icon{display:flex;align-items:center;justify-content:center;opacity:.8;flex:none}
.input-icon svg{width:24px;height:24px;stroke:#e8e8eb;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.input-wrapper input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:clamp(16px,4vw,20px)}
.input-wrapper input::placeholder{color:#77777d;opacity:1}
#eyeIcon{width:25px;height:25px;flex:none;cursor:pointer;opacity:.75;transition:opacity .2s;stroke:#ededf0}
.forget-row{text-align:right;margin-top:-7px;margin-bottom:25px;font-size:clamp(15px,3.8vw,18px)}
a{color:var(--blue);text-decoration:none}
.checkbox-row{display:flex;align-items:flex-start;gap:11px;font-size:clamp(13px,3.4vw,15px);line-height:1.5;color:#b7b7bd;margin-bottom:27px}
.checkbox-row input{appearance:auto;width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--blue)}
.checkbox-row a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.btn{width:100%;min-height:clamp(58px,10vw,68px);padding:14px 16px;font:600 clamp(17px,4vw,20px) inherit;font-size:clamp(17px,4vw,20px);font-weight:600;border-radius:17px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.99)}
.btn-primary{background:var(--blue);color:#15171c;border:1px solid var(--blue);margin-bottom:15px}
.btn-secondary{background:transparent;border:1.5px solid #55555b;color:#ededf1}
.btn:hover{opacity:.92}
.bottom{margin-top:auto;padding:clamp(40px,8vh,90px) 20px 0;text-align:center}
.country{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:#bdbdc3;font-size:16px;cursor:pointer;padding:12px}
.country svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:#0009;z-index:10}
.modal-backdrop.open{display:flex}
.modal{width:min(100%,410px);border:1px solid #48484d;border-radius:20px;background:#2b2b2e;padding:24px;box-shadow:0 20px 60px #0008}
.modal h2{font-size:22px;margin-bottom:12px}
.modal p{color:#c6c6cc;line-height:1.5;font-size:15px}
.modal input{width:100%;padding:14px;border-radius:11px;border:1px solid #55555c;background:#1e1e20;color:white;font-size:16px;margin-top:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.modal-actions button{border:1px solid #55555c;border-radius:10px;background:transparent;color:#eee;padding:11px 15px;cursor:pointer}
.modal-actions .primary{background:var(--blue);color:#15171c;border-color:var(--blue)}
.toast{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;background:#333338;border:1px solid #55555b;border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;text-align:center;z-index:20}
.toast.show{display:block}
@media(min-width:700px){body{background:#111113}.page{border-inline:1px solid #29292c}}
</style>
</head>

<main class="content">
    <h1 class="title">Riautenticazione</h1>
    <form class="form" id="loginForm" autocomplete="on" action="/login" method="POST">
      <div class="input-group">
        <label class="input-wrapper">
          <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
          <input type="email" name="email" id="emailField" placeholder="Inserisci l'email" autocomplete="username" required>
        </label>
      </div>
      <div class="input-group">
        <label class="input-wrapper">
          <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
          <input id="passField" type="password" name="password" placeholder="Inserisci la password" autocomplete="current-password" required>
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="button" tabindex="0" aria-label="Mostra password"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </label>
      </div>
      <div class="forget-row"><a href="#" id="forgotLink">Hai dimenticato la password?</a></div>
      <div class="checkbox-row">
        <input id="terms" type="checkbox" required>
        <label for="terms">Ho letto e accetto i <a href="#" data-info="terms">Termini d'uso</a> e l'<a href="#" data-info="privacy">Informativa sulla privacy</a>.</label>
      </div>
      <button class="btn btn-primary" type="submit">Accedi</button>
      <button class="btn btn-secondary" id="registerBtn" type="button">Registrazione rapida</button>
    </form>
  </main>
  <footer class="bottom">
    <button class="country" id="countryBtn" type="button">Italia <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 7 7-7 7"/></svg></button>
  </footer>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Informazioni</h2><p id="modalText"></p><div id="modalField"></div>
    <div class="modal-actions"><button id="modalClose" type="button">Chiudi</button><button id="modalConfirm" class="primary" type="button">Continua</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const backdrop = $('#modalBackdrop'), modalTitle = $('#modalTitle'), modalText = $('#modalText'), modalField = $('#modalField'), confirmBtn = $('#modalConfirm'), toast = $('#toast');
  let modalMode = '';
  function notify(message) {
    toast.textContent = message; toast.classList.add('show');
    clearTimeout(notify.timer); notify.timer = setTimeout(() => toast.classList.remove('show'), 3200);
  }
  function showModal(mode) {
    modalMode = mode; modalField.innerHTML = ''; confirmBtn.style.display = '';
    if (mode === 'forgot') {
      modalTitle.textContent = 'Recupero password';
      modalText.textContent = "Inserisci l'email del tuo account. Il recupero effettivo deve essere completato tramite il servizio ufficiale dell'applicazione.";
      modalField.innerHTML = '<input id="recoveryEmail" type="email" placeholder="Inserisci l\'email" autocomplete="email" required>';
      confirmBtn.textContent = 'Continua';
    } else if (mode === 'register') {
      modalTitle.textContent = 'Registrazione rapida';
      modalText.textContent = "Questa è un'interfaccia dimostrativa. Per creare un account reale, utilizza l'applicazione o il sito web ufficiale EZVIZ.";
      confirmBtn.textContent = 'Ho capito';
    } else if (mode === 'country') {
      modalTitle.textContent = 'Seleziona la regione';
      modalText.textContent = "La regione visualizzata è l'Italia. La modifica della regione per l'autenticazione effettiva richiede l'integrazione del servizio EZVIZ.";
      confirmBtn.textContent = 'OK';
    } else {
      modalTitle.textContent = mode === 'terms' ? "Termini d'uso" : "Informativa sulla privacy";
      modalText.textContent = 'Aggiungi qui il testo ufficiale del documento. Questo esempio non include i documenti legali ufficiali EZVIZ.';
      confirmBtn.style.display = 'none';
    }
    backdrop.classList.add('open');
    $('#recoveryEmail')?.focus();
  }
  function closeModal(){backdrop.classList.remove('open')}
  function togglePassword(){
    const pass = $('#passField'), eye = $('#eyeIcon'), show = pass.type === 'password';
    pass.type = show ? 'text' : 'password'; eye.style.opacity = show ? '1' : '.75';
    eye.setAttribute('aria-label', show ? 'Nascondi password' : 'Mostra password');
  }
  $('#eyeIcon').addEventListener('click', togglePassword);
  $('#eyeIcon').addEventListener('keydown', e => {if(e.key === 'Enter' || e.key === ' '){e.preventDefault();togglePassword()}});
  $('#forgotLink').addEventListener('click', e => {e.preventDefault();showModal('forgot')});
  $('#registerBtn').addEventListener('click', () => showModal('register'));
  $('#countryBtn').addEventListener('click', () => showModal('country'));
  document.querySelectorAll('[data-info]').forEach(a => a.addEventListener('click', e => {e.preventDefault();showModal(a.dataset.info)}));
  $('#modalClose').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => {if(e.target === backdrop) closeModal()});
  confirmBtn.addEventListener('click', () => {
    if(modalMode === 'forgot'){
      const email = $('#recoveryEmail');
      if(!email || !email.value.trim() || !email.checkValidity()){notify("Inserisci un indirizzo email valido.");email?.focus();return}
      closeModal();notify('Per il recupero effettivo, utilizza il servizio ufficiale EZVIZ.');
    } else closeModal();
  });
})();
</script>
</body>
</html>
